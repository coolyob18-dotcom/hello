<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Новый день</title>
    <script src="https://telegram.org"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%;
            height: 100%;
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 15px;
            background-color: #0c0d12;
            overflow: hidden;
            position: relative;
        }

        /* Полноэкранный контейнер для фонов */
        .bg-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Слои фонов */
        .bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-layer.active { opacity: 1 !important; }

        /* Размытый задний план (для ПК и ноутбуков) */
        .bg-layer img.blur-bg {
            position: absolute;
            top: -10%; left: -10%; width: 120%; height: 120%;
            object-fit: cover;
            filter: blur(25px) brightness(0.3);
            z-index: 1;
        }

        /* Передняя четкая картинка */
        .bg-layer img.main-img {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
        }

        /* Адаптивная настройка под разные экраны */
        @media (min-width: 769px) {
            /* НА КОМПЬЮТЕРАХ: вписываем картинку целиком, включаем размытие по бокам */
            .bg-layer img.main-img {
                object-fit: contain;
            }
            .bg-layer img.blur-bg {
                display: block;
            }
        }

        @media (max-width: 768px) {
            /* НА ТЕЛЕФОНАХ: картинка красиво заполняет весь экран вертикально */
            .bg-layer img.main-img {
                object-fit: cover;
                object-position: center;
            }
            .bg-layer img.blur-bg {
                display: none;
            }
        }

        /* Настройка для мема с Майлзом (без блюра на всех устройствах) */
        #bg-sad { background-color: #0c0d12; }
        #bg-sad img.blur-bg { display: none !important; }
        #bg-sad img.main-img { 
            width: 100%;
            height: auto;
            max-height: 85vh;
            object-fit: contain !important; 
        }

        /* Затемняющий фильтр поверх картинок для читаемости текста */
        .bg-layer::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 3;
        }
        #bg-sad::before { display: none; }

        /* Стили для карточек */
        .card {
            position: relative;
            z-index: 10;
            max-width: 350px;
            width: 100%;
            text-align: center;
            padding: 35px 25px;
            border-radius: 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            
            opacity: 0;
            visibility: hidden;
            transform: scale(0.95);
            transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s;
            display: none;
        }

        .card.active-card {
            display: block !important;
            opacity: 1 !important;
            visibility: visible !important;
            transform: scale(1) !important;
        }

        .card-white { background: #ffffff; color: #000000; }
        .card-white h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 25px; color: #000000; }

        .card-spidey {
            background: rgba(209, 25, 25, 0.94);
            border: 3.5px solid #ffffff;
            color: #ffffff;
            box-shadow: 0 0 30px rgba(209, 25, 25, 0.5);
        }

        .card-sad {
            margin-top: auto;
            margin-bottom: 8vh;
            background: rgba(0, 0, 0, 0.88);
            border: 3.5px solid #e21b1b;
        }

        .question {
            font-size: 1.4rem;
            line-height: 1.4;
            font-weight: 700;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        .buttons { display: flex; gap: 15px; justify-content: center; }
        .btn {
            border: none;
            font-weight: 700;
            font-size: 1.3rem;
            padding: 12px 32px;
            border-radius: 100px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-start { background: #000000; color: #ffffff; }
        .btn-yes { background: #ffffff; color: #d11919; }
        .btn-no { background: #222222; color: #ffffff; }

        .back-btn {
            margin-top: 15px;
            border: none;
            font-size: 1rem;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <div id="bg-start" class="bg-layer active">
            <img class="blur-bg" src="https://abrakadabra.fun" alt="">
            <img class="main-img" src="https://abrakadabra.fun" alt="">
        </div>
        <div id="bg-main" class="bg-layer">
            <img class="blur-bg" src="https://championat.com" alt="">
            <img class="main-img" src="https://championat.com" alt="">
        </div>
        <div id="bg-yes" class="bg-layer">
            <img class="blur-bg" src="https://abrakadabra.fun" alt="">
            <img class="main-img" src="https://abrakadabra.fun" alt="">
        </div>
        <div id="bg-sad" class="bg-layer">
            <img class="main-img" src="https://meme-arsenal.com" alt="">
        </div>
    </div>

    <!-- ЭКРАН 1 -->
    <div id="screen1" class="card card-white active-card">
        <h1>ну что ж погнали)</h1>
        <button class="btn btn-start" onclick="goMain()">Вперед</button>
    </div>

    <!-- ЭКРАН 2 -->
    <div id="main" class="card card-spidey">
        <div class="question">Привет, чемпионка) это человек паук!<br>готова идти гулять?</div>
        <div class="buttons">
            <button class="btn btn-yes" onclick="ans('yes')">Да</button>
            <button class="btn btn-no" onclick="ans('no')">Нет</button>
        </div>
    </div>

    <!-- ЭКРАН 3 -->
    <div id="yes" class="card card-spidey">
        <div class="question">Супер, жду тебя у пляжки в 15:00</div>
        <button class="back-btn" onclick="back()">← вернуться</button>
    </div>

    <!-- ЭКРАН 4 -->
    <div id="no" class="card card-spidey card-sad">
        <div class="question">this is fine... ладно<br>это обидно но человек паук не сдаётся и идёт дальше</div>
        <button class="back-btn" onclick="back()">← вернуться</button>
    </div>

<script>
try {
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

function switchScreen(targetCardId, targetBgId) {
    const activeCard = document.querySelector('.card.active-card');
    if (activeCard) activeCard.classList.remove('active-card');

    document.querySelectorAll('.bg-layer').forEach(layer => layer.classList.remove('active'));
    
    const nextBg = document.getElementById(targetBgId);
    if (nextBg) nextBg.classList.add('active');

    setTimeout(() => {
        const nextCard = document.getElementById(targetCardId);
        if (nextCard) nextCard.classList.add('active-card');
    }, 50);
}

</script>
</body>
</html>
