<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый день</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        
        /* Главное исправление: по умолчанию ВСЕ экраны строго скрыты */
        .screen {
            display: none; 
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            position: absolute;
            top: 0; left: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Показываем ТОЛЬКО первый экран при старте */
        #screen1 { 
            display: flex; 
            background-image: url('https://abrakadabra.fun');
        }
        
        /* Белая табличка для Первого экрана */
        .card {
            background-color: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 400px;
            position: relative;
            z-index: 2;
        }
        .card h1 { color: #000; font-size: 26px; margin-bottom: 30px; font-weight: 700; }
        
        .btn {
            display: inline-block;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            cursor: pointer;
            border: none;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-black { background-color: #000; color: #fff; }
        
        /* ЭКРАНЫ 2 и 3: Арт «Новый день» (Выбор и Да) */
        .spidey-bg-main {
            background-image: url('https://championat.com');
        }

        /* ЭКРАН 4: Мем с Майлзом (Нет) */
        .spidey-bg-sad {
            background-color: #0c0d12;
            background-image: url('https://meme-arsenal.com');
            background-size: contain;
            background-position: center;
        }
        
        /* Затемнение поверх картинок для читаемости */
        .spidey-bg-main::before, #screen1::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }
        
        /* Красный блок с текстом */
        .spidey-box {
            position: relative;
            z-index: 2;
            background: rgba(209, 25, 25, 0.85);
            border: 4px solid #fff;
            padding: 35px 25px;
            border-radius: 20px;
            color: #fff;
            max-width: 90%;
            width: 440px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
        }

        /* Черная плашка для экрана с мемом, чтобы не закрывать лицо Майлза */
        .sad-box {
            margin-top: auto;
            margin-bottom: 40px;
            background: rgba(0, 0, 0, 0.8) !important;
            border-color: #e21b1b !important;
        }
        
        .spidey-box h2 {
            font-size: 24px;
            line-height: 1.4;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        
        /* Кнопки Да / Нет */
        .btn-zone { display: flex; gap: 20px; justify-content: center; margin-top: 30px; }
        .btn-yes { background-color: #ffffff; color: #d11919; } 
        .btn-no { background-color: #222222; color: #ffffff; }  
        .btn-yes:hover, .btn-no:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Старт -->
    <div id="screen1" class="screen">
        <div class="card">
            <h1>ну что ж погнали)</h1>
            <button class="btn btn-black" onclick="nextScreen(2)">Вперед</button>
        </div>
    </div>

    <!-- ЭКРАН 2: Приглашение -->
    <div id="screen2" class="screen spidey-bg-main">
        <div class="spidey-box">
            <h2>Привет, это человек паук!<br>готова идти гулять?</h2>
            <div class="btn-zone">
                <button class="btn btn-yes" onclick="nextScreen(3)">Да</button>
                <button class="btn btn-no" onclick="nextScreen(4)">Нет</button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 3: Согласие (ДА) -->
    <div id="screen3" class="screen spidey-bg-main">
        <div class="spidey-box">
            <h2>жду тебя на у пляжки в 15:00</h2>
        </div>
    </div>

    <!-- ЭКРАН 4: Отказ (НЕТ) -->
    <div id="screen4" class="screen spidey-bg-sad">
        <div class="spidey-box sad-box">
            <h2>это обидно но человек паук не сдаётся и идёт дальше</h2>
        </div>
    </div>

    <script>
        // Функция переключения экранов
        function nextScreen(screenId) {
            // Сначала строго скрываем вообще все экраны
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            // Показываем только тот, на который нажали
            document.getElementById('screen' + screenId).style.style.setProperty('display', 'flex', 'important');
            document.getElementById('screen' + screenId).style.display = 'flex';
        }
    </script>
</body>
</html>
