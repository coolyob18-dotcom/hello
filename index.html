<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's the point?</title>
    <!-- Подключаем Telegram WebApp и библиотеку Конфетти -->
    <script src="https://telegram.org"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%;
            height: 100%;
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px;
            background-color: #0c0d12;
            overflow: hidden;
            position: relative;
        }

        /* Полноэкранный контейнер для фонов */
        .bg-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Слои фонов с красивой плавной анимацией растворения */
        .bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-layer.active { opacity: 1; }

        /* Размытие заднего плана, чтобы заполнить поля под любой экран */
        .bg-layer img.blur-bg {
            position: absolute;
            top: -10%; left: -10%; width: 120%; height: 120%;
            object-fit: cover;
            filter: blur(25px) brightness(0.35);
            z-index: 1;
        }

        /* Передняя картинка без потери качества и обрезки */
        .bg-layer img.main-img {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 2;
        }

        /* Настройка для мема с Майлзом (без блюра) */
        #bg-sad { background-color: #0c0d12; }
        #bg-sad img.main-img { max-height: 100vh; width: auto; max-width: 100%; }

        /* Стили для карточек */
        .card {
            position: relative;
            z-index: 10;
            max-width: 380px;
            width: 100%;
            text-align: center;
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            
            /* Плавное выплывание карточек */
            opacity: 0;
            visibility: hidden;
            transform: scale(0.95);
            transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s;
            position: absolute;
        }

        .card.active-card {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
            position: relative;
        }

        .card-white { background: #ffffff; color: #000000; }
        .card-white h1 { font-size: 2rem; font-weight: 800; margin-bottom: 25px; }

        .card-spidey {
            background: rgba(209, 25, 25, 0.93);
            border: 4px solid #ffffff;
            color: #ffffff;
            box-shadow: 0 0 35px rgba(209, 25, 25, 0.5);
        }

        .card-sad {
            margin-top: auto;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.88);
            border: 4px solid #e21b1b;
        }

        .question {
            font-size: 1.5rem;
            line-height: 1.4;
            font-weight: 700;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        .buttons { display: flex; gap: 15px; justify-content: center; }
        .btn {
            border: none;
            font-weight: 700;
            font-size: 1.4rem;
            padding: 12px 32px;
            border-radius: 100px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-start { background: #000000; color: #ffffff; }
        .btn-yes { background: #ffffff; color: #d11919; }
        .btn-no { background: #222222; color: #ffffff; }

        .back-btn {
            margin-top: 20px;
            border: none;
            font-size: 1.1rem;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>

    <!-- Контейнер картинок через тег <img> с защитой от кэширования (?v=4) -->
    <div class="bg-container">
        <div id="bg-start" class="bg-layer active">
            <img class="blur-bg" src="https://media.istockphoto.com/id/2228380241/ru/%D0%B2%D0%B5%D0%BA%D1%82%D0%BE%D1%80%D0%BD%D0%B0%D1%8F/%D1%85%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D0%B8%D0%BD-%D0%B3%D1%80%D0%B0%D0%BD%D0%B6-%D0%BF%D0%B0%D1%83%D1%82%D0%B8%D0%BD%D0%B0-%D1%80%D0%B0%D0%BC%D0%BA%D0%B0-%D1%84%D0%BE%D0%BD.jpg?s=612x612&w=0&k=20&c=Epx4x0JDpnM-kZ43SqCRoDwd1NbK22eOzDFSce4z-eE="">
            <img class="main-img" src="https://media.istockphoto.com/id/2228380241/ru/%D0%B2%D0%B5%D0%BA%D1%82%D0%BE%D1%80%D0%BD%D0%B0%D1%8F/%D1%85%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D0%B8%D0%BD-%D0%B3%D1%80%D0%B0%D0%BD%D0%B6-%D0%BF%D0%B0%D1%83%D1%82%D0%B8%D0%BD%D0%B0-%D1%80%D0%B0%D0%BC%D0%BA%D0%B0-%D1%84%D0%BE%D0%BD.jpg?s=612x612&w=0&k=20&c=Epx4x0JDpnM-kZ43SqCRoDwd1NbK22eOzDFSce4z-eE="">
        </div>
        <div id="bg-main" class="bg-layer">
            <img class="blur-bg" src="https://img.championat.com/IZUd_1ZVU_pyKTjwHFgLiGI90iD-0bswePzGtp5LjnI/p()/news/big/b/j/film-chelovek-pauk-novyj-den-2026_1785669814752945263.jpg"">
            <img class="main-img" src="https://img.championat.com/IZUd_1ZVU_pyKTjwHFgLiGI90iD-0bswePzGtp5LjnI/p()/news/big/b/j/film-chelovek-pauk-novyj-den-2026_1785669814752945263.jpg"">
        </div>
        <div id="bg-yes" class="bg-layer">
            <img class="blur-bg" src="https://newcdn.igromania.ru/articles/pics/tmp/images/2026/8/25/f66ffe2d-a534-4a48-99b0-c68f3a72135e.jpg"">
            <img class="main-img" src="https://newcdn.igromania.ru/articles/pics/tmp/images/2026/8/25/f66ffe2d-a534-4a48-99b0-c68f3a72135e.jpg"">
        </div>
        <div id="bg-sad" class="bg-layer">
            <img class="main-img" src="https://images.meme-arsenal.com/fb45854003af82a90bca92eead5ec641.jpg"">
        </div>
    </div>

    <!-- ЭКРАН 1 -->
    <div id="screen1" class="card card-white active-card">
        <h1>ну что ж погнали)</h1>
        <button class="btn btn-start" onclick="goMain()">Вперед</button>
    </div>

    <!-- ЭКРАН 2 -->
    <div id="main" class="card card-spidey">
        <div class="question">Ну привет, чемпионка) это человек паук!<br>готова идти гулять?</div>
        <div class="buttons">
            <button class="btn btn-yes" onclick="ans('yes')">Да</button>
            <button class="btn btn-no" onclick="ans('no')">Нет</button>
        </div>
    </div>

    <!-- ЭКРАН 3 -->
    <div id="yes" class="card card-spidey">
        <div class="question">Супер, жду тебя у пляжки в 15:00</div>
        <button class="back-btn" onclick="back()">← вернуться</button>
    </div>

    <!-- ЭКРАН 4 -->
    <div id="no" class="card card-spidey card-sad">
        <div class="question"><br>это обидно... но человек паук не сдаётся и идёт дальше</div>
        <button class="back-btn" onclick="back()">← вернуться</button>
    </div>

<script>
const tg = window.Telegram?.WebApp;
if(tg) { tg.ready(); tg.expand(); }

function switchScreen(targetCardId, targetBgId) {
    const activeCard = document.querySelector('.card.active-card');
    if (activeCard) activeCard.classList.remove('active-card');

    document.querySelectorAll('.bg-layer').forEach(layer => layer.classList.remove('active'));
    document.getElementById(targetBgId).classList.add('active');

    setTimeout(() => {
        document.getElementById(targetCardId).classList.add('active-card');
    }, 50);
}

function goMain() { switchScreen('main', 'bg-main'); }

function ans(c) {
    let t = '', u = 'Кто-то';
    if(tg?.initDataUnsafe?.user) {
        const d = tg.initDataUnsafe.user;
        u = [d.first_name, d.last_name].filter(Boolean).join(' ') || 'Кто-то';
        if(d.username) u += ' (@' + d.username + ')';
    }
    
    if(c === 'yes') {
        switchScreen('yes', 'bg-yes');
        
        // КОРРЕКТНЫЙ НЕЗАВИСИМЫЙ ВЫЗОВ КОНФЕТТИ
        try {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 120, angle: 60, spread: 70, origin: { x: 0, y: 0.6 } });
                confetti({ particleCount: 120, angle: 120, spread: 70, origin: { x: 1, y: 0.6 } });
            }
        } catch(e) { console.log(e); }
        
        t = '🕷️ 🔴 <b>' + u + '</b> ответил(а): ДА, ИДЁТ ГУЛЯТЬ!';
    } else {
        switchScreen('no', 'bg-sad');
        t = '🕷️ ⚫ <b>' + u + '</b> отказался(ась)... Человек-паук грустит.';
    }
    
    fetch('https://telegram.org', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({chat_id: '6269187112', text: t, parse_mode: 'HTML'})
    });
}

function back() { switchScreen('main', 'bg-main'); }
</script>
</body>
</html>
