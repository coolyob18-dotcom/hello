<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый день</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px;
            background-color: #000;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            transition: background-image 0.3s ease;
        }

        /* Затемнение для заднего фона, чтобы карточки читались */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        /* Стили для ФОНОВ (меняются скриптом) */
        body.bg-start {
            background-image: url('https://media.istockphoto.com/id/2228380241/ru/%D0%B2%D0%B5%D0%BA%D1%82%D0%BE%D1%80%D0%BD%D0%B0%D1%8F/%D1%85%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D0%B8%D0%BD-%D0%B3%D1%80%D0%B0%D0%BD%D0%B6-%D0%BF%D0%B0%D1%83%D1%82%D0%B8%D0%BD%D0%B0-%D1%80%D0%B0%D0%BC%D0%BA%D0%B0-%D1%84%D0%BE%D0%BD.jpg?s=612x612&w=0&k=20&c=Epx4x0JDpnM-kZ43SqCRoDwd1NbK22eOzDFSce4z-eE=');
        }
        body.bg-main {
            background-image: url('https://img.championat.com/IZUd_1ZVU_pyKTjwHFgLiGI90iD-0bswePzGtp5LjnI/p()/news/big/b/j/film-chelovek-pauk-novyj-den-2026_1785669814752945263.jpg');
        }
        body.bg-sad {
            background-color: #0c0d12;
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRjpHplOysN0A4Lk1SBtQH3xN1s73ZGLo5jQkAq35ZNxQ&s=10');
            background-size: contain;
        }
        body.bg-sad::before {
            display: none; /* убираем затемнение на меме */
        }

        /* Общие карточки */
        .card {
            position: relative;
            z-index: 2;
            max-width: 400px;
            width: 100%;
            text-align: center;
            padding: 40px 25px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        /* Карточка 1: Белая стартовая */
        .card-white {
            background: #ffffff;
            color: #000000;
        }
        .card-white h1 {
            font-size: 2.1rem;
            font-weight: 800;
            margin-bottom: 30px;
            color: #000;
        }

        /* Карточки Паука: Полупрозрачные красные */
        .card-spidey {
            background: rgba(209, 25, 25, 0.88);
            border: 4px solid #ffffff;
            color: #ffffff;
            box-shadow: 0 0 35px rgba(209, 25, 25, 0.4);
        }

        /* Особая карточка для мема с Майлзом (Черная плашка внизу) */
        .card-sad {
            margin-top: auto;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.85);
            border: 4px solid #e21b1b;
            color: #ffffff;
        }

        .hidden { display: none !important; }

        .question {
            font-size: 1.6rem;
            line-height: 1.4;
            font-weight: 700;
            margin-bottom: 35px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* Кнопки */
        .buttons { display: flex; gap: 20px; justify-content: center; }
        .btn {
            border: none;
            font-weight: 700;
            font-size: 1.5rem;
            padding: 14px 35px;
            border-radius: 100px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }

        .btn-start { background: #000000; color: #ffffff; }
        .btn-yes { background: #ffffff; color: #d11919; }
        .btn-no { background: #222222; color: #ffffff; }

        .back-btn {
            margin-top: 25px;
            border: none;
            font-size: 1.1rem;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.4);
        }
    </style>
</head>
<body class="bg-start">

    <!-- ЭКРАН 1: Старт (Черный стиль, белая плашка) -->
    <div id="screen1" class="card card-white">
        <h1>ну что ж погнали)</h1>
        <button class="btn btn-start" onclick="goMain()">Вперед</button>
    </div>

    <!-- ЭКРАН 2: Главный вопрос Паука -->
    <div id="main" class="card card-spidey hidden">
        <div class="question">Привет, это человек паук!<br>готова идти гулять?</div>
        <div class="buttons">
            <button class="btn btn-yes" onclick="ans('yes')">Да</button>
            <button class="btn btn-no" onclick="ans('no')">Нет</button>
        </div>
    </div>

    <!-- ЭКРАН 3: Согласие (ДА) -->
    <div id="yes" class="card card-spidey hidden">
        <div class="question">жду тебя на у пляжки в 15:00</div>
        <button class="back-btn" onclick="back()">← вернуться</button>
    </div>

    <!-- ЭКРАН 4: Отказ (НЕТ) -->
    <div id="no" class="card card-spidey card-sad hidden">
        <div class="question">this is fine... ладно<br>это обидно но человек паук не сдаётся и идёт дальше</div>
        <button class="back-btn" onclick="back()">← вернуться</button>
    </div>

<script>
const tg = window.Telegram?.WebApp;
if(tg) { tg.ready(); tg.expand(); }

// Шаг 1: переход со стартового экрана к вопросу Паука
function goMain() {
    document.getElementById('screen1').classList.add('hidden');
    document.getElementById('main').classList.remove('hidden');
    
    // Меняем фон на Паука «Новый день»
    document.body.className = 'bg-main';
}

function ans(c) {
    document.getElementById('main').classList.add('hidden');
    let t = '', u = 'Кто-то';
    
    if(tg?.initDataUnsafe?.user) {
        const d = tg.initDataUnsafe.user;
        u = [d.first_name, d.last_name].filter(Boolean).join(' ') || 'Кто-то';
        if(d.username) u += ' (@' + d.username + ')';
    }
    
    if(c === 'yes') {
        document.getElementById('yes').classList.remove('hidden');
        document.body.className = 'bg-main'; // сохраняем фон
        if(typeof confetti === 'function') {
            confetti({particleCount: 150, spread: 80, origin: {y: 0.5, x: 0.5}});
        }
        t = '🕷️ 🔴 <b>' + u + '</b> ответил(а): ДА, ИДЁТ ГУЛЯТЬ!';
    } else {
        document.getElementById('no').classList.remove('hidden');
        document.body.className = 'bg-sad'; // включаем фон мема с Майлзом
        t = '🕷️ ⚫ <b>' + u + '</b> отказался(ась)... Человек-паук грустит.';
    }
    
    // Ваш рабочий бот Telegram
    fetch('https://api.telegram.org/bot8689645734:AAH5alIT5e3XdhThNWlV-jq76V_ALsvJq0Y/sendMessage', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({chat_id: '6269187112', text: t, parse_mode: 'HTML'})
    }).then(r => r.json()).then(d => {
        if(d.ok && tg) setTimeout(() => tg.close(), 3000);
    });
}

function back() {
    document.getElementById('main').classList.remove('hidden');
    document.getElementById('yes').classList.add('hidden');
    document.getElementById('no').classList.add('hidden');
    document.body.className = 'bg-main'; // возвращаем основной фон Человека-паука
}
</script>
</body>
</html>
